<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dart Scorer</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0a22;--panel:rgba(28,20,58,.86);--panel2:rgba(55,38,104,.7);--line:rgba(255,255,255,.1);--text:#f7f2ff;--muted:#ab9fcc;--red:#ff4d6d;--green:#22c993;--gold:#ffcf4a;--pink:#ff5fa2;--cyan:#38d9f0}
*{box-sizing:border-box}
html,body{margin:0;min-height:100vh;color:var(--text);font-family:Barlow,system-ui,-apple-system,sans-serif;
  background:radial-gradient(1200px 700px at 8% -10%,rgba(255,95,162,.25),transparent 60%),radial-gradient(1000px 700px at 108% 5%,rgba(56,217,240,.18),transparent 60%),var(--bg);background-attachment:fixed}
button{font:inherit;cursor:pointer;color:inherit}
.c{font-family:'Barlow Condensed',system-ui,sans-serif}
.wrap{max-width:1500px;margin:0 auto;padding:16px}
h1{margin:0;font-family:'Barlow Condensed',system-ui,sans-serif;font-size:34px;font-weight:800;text-transform:uppercase}
.gold{background:linear-gradient(90deg,#ffcf4a,#fff3c4,#ff9f43);-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-weight:700}
.btn.on{background:var(--green);border-color:var(--green);color:#04160f}
.btn.pri{background:var(--gold);border-color:var(--gold);color:#2a1a00}
.btn.ghost{background:transparent}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;backdrop-filter:blur(6px)}
.muted{color:var(--muted)}

/* setup */
.setup{max-width:820px;margin:30px auto;display:grid;gap:16px}
.lbl{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:8px;font-weight:700}
.games{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.games button{padding:22px 10px;border-radius:14px;border:2px solid var(--line);background:var(--panel2);font-family:'Barlow Condensed',system-ui,sans-serif;font-size:36px;font-weight:800}
.games button.sel{border-color:var(--gold);background:rgba(255,207,74,.15);color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);font-weight:700}
.chip.sel{background:var(--pink);border-color:var(--pink)}
.chip .n{display:inline-block;background:rgba(0,0,0,.3);border-radius:999px;padding:0 7px;margin-left:6px;font-size:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input.txt{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:inherit}

/* play */
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.top .row .btn{padding:8px 12px}
.play{display:grid;grid-template-columns:1fr 420px;gap:16px;align-items:start}
@media(max-width:1000px){.play{grid-template-columns:1fr}}
.board{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.pl{position:relative;background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:14px 18px;transition:.25s}
.pl.act{border-color:var(--gold);box-shadow:0 0 0 4px rgba(255,207,74,.15),0 0 40px rgba(255,207,74,.25);background:linear-gradient(180deg,rgba(255,207,74,.12),var(--panel))}
.pl .nm{font-family:'Barlow Condensed',system-ui,sans-serif;font-size:30px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.pl .legs{display:flex;gap:5px}
.pl .legs i{width:14px;height:14px;border-radius:50%;border:2px solid var(--gold)}
.pl .legs i.w{background:var(--gold)}
.setb{font-family:'Barlow Condensed',system-ui,sans-serif;font-size:18px;font-weight:800;background:var(--pink);color:#fff;border-radius:8px;padding:1px 8px;margin-right:8px}
.pl .nm>span:last-child,.cr th .legs{display:inline-flex;gap:5px;vertical-align:middle}
.cr th .legs i{width:12px;height:12px;border-radius:50%;border:2px solid var(--gold);display:inline-block}
.cr th .legs i.w{background:var(--gold)}
.pl .rem{font-family:'Barlow Condensed',system-ui,sans-serif;font-size:clamp(72px,9vw,150px);font-weight:800;line-height:1;margin:4px 0}
.pl.act .rem{color:var(--gold)}
.pl .stats{display:flex;gap:16px;color:var(--muted);font-size:15px;font-weight:600}
.pl .stats b{color:var(--text)}
.pl .co{margin-top:8px;font-family:'Barlow Condensed',system-ui,sans-serif;font-size:24px;font-weight:700;color:var(--cyan)}
.pl .hist{margin-top:6px;color:var(--muted);font-size:14px}
.pl .turnarrow{position:absolute;top:-12px;left:18px;background:var(--gold);color:#2a1a00;font-weight:800;font-size:12px;letter-spacing:.1em;padding:2px 8px;border-radius:6px}

.inp{display:grid;gap:12px;position:sticky;top:12px}
.disp{font-family:'Barlow Condensed',system-ui,sans-serif;font-size:64px;font-weight:800;text-align:center;background:rgba(0,0,0,.3);border-radius:14px;padding:6px;min-height:84px;letter-spacing:.04em}
.disp.err{color:var(--red)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keys button{padding:16px 0;font-family:'Barlow Condensed',system-ui,sans-serif;font-size:32px;font-weight:800;border-radius:12px;border:1px solid var(--line);background:var(--panel2)}
.keys button.ok{background:var(--green);color:#04160f;border-color:var(--green)}
.keys button.del{background:rgba(255,77,109,.25)}
.turnbox{display:grid;grid-template-columns:repeat(3,1fr) 1.2fr;gap:6px;align-items:center}
.turnbox span{text-align:center;padding:10px 0;border-radius:10px;background:rgba(0,0,0,.3);font-family:'Barlow Condensed',system-ui,sans-serif;font-size:28px;font-weight:800;color:var(--muted)}
.turnbox span.f{color:var(--text);background:var(--panel2)}
.turnbox b{text-align:center;font-family:'Barlow Condensed',system-ui,sans-serif;font-size:44px;color:var(--gold)}
.fl{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:8px 0 4px}
.fg{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.fg button{padding:10px 0;font-family:'Barlow Condensed',system-ui,sans-serif;font-size:21px;font-weight:800;border-radius:8px;border:1px solid var(--line);background:var(--panel2)}
.fg.d button{background:rgba(34,201,147,.28);border-color:rgba(34,201,147,.5)}
.fg.t button{background:rgba(255,77,109,.28);border-color:rgba(255,77,109,.5)}
.fg button:active,.fx button:active{transform:scale(.94)}
.fx{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.fx button{padding:13px 0;font-family:'Barlow Condensed',system-ui,sans-serif;font-size:24px;font-weight:800;border-radius:10px;border:1px solid var(--line);background:var(--panel2)}
.fx button.bull{background:rgba(255,77,109,.35)}
.fx button.miss{background:rgba(0,0,0,.35)}
.quick{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.quick button{padding:9px 0;font-weight:800;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.05)}
.voice{border-radius:14px;padding:12px 14px;background:rgba(0,0,0,.25);border:1px solid var(--line)}
.voice .st{font-weight:700;display:flex;gap:8px;align-items:center}
.voice .dot{width:12px;height:12px;border-radius:50%;background:var(--muted)}
.voice.on .dot{background:var(--red);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.voice .heard{margin-top:6px;color:var(--muted);font-size:15px;min-height:20px}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--red);color:#fff;font-weight:800;padding:10px 20px;border-radius:12px;opacity:0;transition:.3s;z-index:20;font-size:20px}
.toast.show{opacity:1}

/* cricket */
table.cr{width:100%;border-collapse:separate;border-spacing:0 6px}
.cr th{font-family:'Barlow Condensed',system-ui,sans-serif;font-size:26px;font-weight:800;padding:6px 8px}
.cr th.act{color:var(--gold)}
.cr td{text-align:center;background:var(--panel);padding:4px;font-family:'Barlow Condensed',system-ui,sans-serif;font-size:44px;font-weight:800;line-height:1}
.cr td.num{background:var(--panel2);font-size:36px;color:var(--gold);width:110px}
.cr td.act{background:rgba(255,207,74,.12)}
.cr tr.closed td.num{color:var(--muted);text-decoration:line-through}
.cr .pts td{font-size:52px;color:var(--cyan)}
.mk{display:inline-block;min-width:1.2em}
.mk.m3{color:var(--green)}
.mult{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mult button{padding:12px 0;font-weight:800;font-size:20px;border-radius:12px;border:1px solid var(--line);background:var(--panel2)}
.mult button.sel{background:var(--pink);border-color:var(--pink)}
.crk{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.crk button{padding:16px 0;font-family:'Barlow Condensed',system-ui,sans-serif;font-size:30px;font-weight:800;border-radius:12px;border:1px solid var(--line);background:var(--panel2)}
.crk button.miss{background:rgba(255,77,109,.25)}
.dts{display:flex;gap:8px;justify-content:center;font-size:15px;color:var(--muted);align-items:center}
.dts i{width:14px;height:14px;border-radius:50%;border:2px solid var(--gold)}
.dts i.u{background:var(--gold)}

/* overlay */
#ov{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:radial-gradient(circle,rgba(255,77,109,.6),rgba(15,10,34,.95) 70%);opacity:0;pointer-events:none;transition:opacity .3s;text-align:center;padding:20px}
#ov.show{opacity:1;pointer-events:auto}
#ov .big{font-family:'Barlow Condensed',system-ui,sans-serif;font-weight:800;font-size:min(30vw,300px);line-height:.85;background:linear-gradient(180deg,#fff6c9,#ffcf4a 45%,#ff9f43);-webkit-background-clip:text;background-clip:text;color:transparent}
#ov.show .big{animation:pop .6s cubic-bezier(.2,1.7,.4,1)}
#ov .t1{font-family:'Barlow Condensed',system-ui,sans-serif;font-size:min(8vw,64px);font-weight:800;letter-spacing:.08em}
#ov .t2{font-size:22px;color:#ffd9e2;font-weight:600}
@keyframes pop{0%{transform:scale(0) rotate(-10deg)}100%{transform:scale(1)}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<div id="ov" onclick="hideOv()"><div class="big" id="ovBig"></div><div class="t1" id="ovT1"></div><div class="t2" id="ovT2"></div></div>
<script>
const KEY='dart-scorer-v1';
const PRESET=['Hartvig','Stefan','Sømand','Harbo','Paula','Annette','Jeanette','Renette'];
const CR=[20,19,18,17,16,15,25];
const IMPOSSIBLE=new Set([163,166,169,172,173,175,176,178,179]);

let S=load();
function blank(){ return {phase:'setup', game:'501', doubleOut:true, legsToWin:1, setsToWin:1, sel:[], extra:[], G:null, H:[], voice:false, caller:true, mode:'fields'}; }
function load(){ try{ const s=JSON.parse(localStorage.getItem(KEY)); if(s&&s.phase) return Object.assign(blank(),s,{voice:false}); }catch(e){} return blank(); }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- Danske tal fra tale ---------- */
const W={nul:0,en:1,et:1,een:1,to:2,tre:3,fire:4,fem:5,seks:6,syv:7,otte:8,ni:9,ti:10,elleve:11,tolv:12,tretten:13,fjorten:14,femten:15,seksten:16,sytten:17,atten:18,nitten:19,tyve:20,tredive:30,tredve:30,fyrre:40,fyrretyve:40,halvtreds:50,halvtredsindstyve:50,tres:60,tresindstyve:60,halvfjerds:70,firs:80,firsindstyve:80,halvfems:90};
function daNum(str){
  let t=' '+str.toLowerCase().replace(/[^a-zæøå0-9 ]/g,' ')+' ';
  const d=t.match(/\d+/); if(d) return +d[0];
  t=t.replace(/hundrede/g,' hundrede ').replace(/og/g,' og ');
  let total=0,pend=null,found=false;
  for(const tok of t.split(/\s+/).filter(Boolean)){
    if(tok==='hundrede'||tok==='hundred'){ total+=(pend??1)*100; pend=null; found=true; }
    else if(tok in W){ if(pend!==null) total+=pend; pend=W[tok]; found=true; }
  }
  if(pend!==null) total+=pend;
  return found?total:null;
}

/* ---------- Checkout-forslag ---------- */
const SETUP=[...Array(20)].map((_,i)=>({v:(20-i)*3,l:'T'+(20-i)})).concat([{v:25,l:'25'},{v:50,l:'Bull'}],[...Array(20)].map((_,i)=>({v:20-i,l:''+(20-i)})),[...Array(20)].map((_,i)=>({v:(20-i)*2,l:'D'+(20-i)})));
const FIN=[20,16,18,12,10,8,19,17,15,14,13,11,9,7,6,5,4,3,2,1].map(n=>({v:n*2,l:'D'+n})).concat([{v:50,l:'Bull'}]);
const coCache={};
function checkout(r,n=3){
  if(r>170||r<2||n<1) return null; const ck=r+'-'+n; if(ck in coCache) return coCache[ck];
  let res=null;
  for(const d of FIN) if(d.v===r){ res=[d.l]; break; }
  if(!res&&n>=2) outer2: for(const d of FIN) for(const a of SETUP) if(a.v+d.v===r){ res=[a.l,d.l]; break outer2; }
  if(!res&&n>=3) outer3: for(const a of SETUP) for(const d of FIN) for(const b of SETUP) if(a.v+b.v+d.v===r){ res=[a.l,b.l,d.l]; break outer3; }
  return coCache[ck]=res;
}

/* ---------- Spil-logik ---------- */
function snap(){ S.H.push(JSON.stringify(S.G)); if(S.H.length>200) S.H.shift(); }
function undo(){ if(!S.H.length) return; S.G=JSON.parse(S.H.pop()); entry=''; save(); render(); toast('Fortrudt'); }
function startGame(){
  const names=S.sel.slice(); if(!names.length) return toast('Vælg mindst én spiller');
  const x01=S.game!=='cricket';
  S.G={game:S.game, doubleOut:S.doubleOut, legsToWin:S.legsToWin, setsToWin:S.setsToWin||1, set:1, cur:0, starter:0, leg:1, darts:0, winner:null, turn:[],
    P:names.map(n=>x01?{name:n,rem:+S.game,legs:0,sets:0,darts:0,scored:0,hist:[]}:{name:n,marks:Object.fromEntries(CR.map(c=>[c,0])),pts:0,legs:0,sets:0,darts:0,hist:[]})};
  S.H=[]; S.phase='play'; entry=''; save(); render();
  say(`${names[0]} starter. Game on!`);
}
function newLeg(){
  const G=S.G; G.leg++; G.starter=(G.starter+1)%G.P.length; G.cur=G.starter; G.darts=0; G.turn=[];
  G.P.forEach(p=>{ if(G.game==='cricket'){ p.marks=Object.fromEntries(CR.map(c=>[c,0])); p.pts=0; } else p.rem=+G.game; p.hist=[]; });
}
function legWon(p){
  const G=S.G, ST=G.setsToWin||1; p.legs++; p.sets=p.sets||0;
  const res=()=>G.P.map(x=>x.name+' '+(ST>1?x.sets:x.legs)).join(' – ');
  if(p.legs>=G.legsToWin){
    p.sets++;
    if(p.sets>=ST){ G.winner=p.name; showOv('🏆',`${p.name} VINDER!`,`${G.game==='cricket'?'Cricket':G.game} · ${ST>1?'sæt ':''}${res()}`,0); say(`Game shot, and the match! ${p.name} vinder!`); return; }
    showOv('🔥','SÆT TIL '+p.name.toUpperCase()+'!',`Sæt ${G.set} · stilling i sæt: ${res()}`,4000); say(`Game shot, and the set! ${p.name} vinder sættet.`);
    G.set++; G.P.forEach(x=>x.legs=0); G.leg=0; newLeg();
  }
  else { showOv('🎯','GAME SHOT!',`${p.name} vinder leg ${G.leg}`,3500); say(`Game shot! ${p.name} vinder leget.`); newLeg(); }
}
function nextPlayer(){ const G=S.G; G.cur=(G.cur+1)%G.P.length; G.darts=0; G.turn=[]; }

// 501 / 301
function submitScore(n){
  const G=S.G; if(!G||G.winner||G.game==='cricket') return;
  if(n==null||isNaN(n)||n<0||n>180||IMPOSSIBLE.has(n)) return toast(`${n??'?'} er ikke en gyldig score`);
  const p=G.P[G.cur]; if(!(G.turn&&G.turn.length)) snap(); G.turn=[];
  const left=p.rem-n;
  const bust = left<0 || (G.doubleOut && left===1);
  p.darts+=3;
  if(bust){ p.hist.unshift('BUST'); say(`Bust! ${p.name} mangler stadig ${p.rem}`); toast('BUST!'); nextPlayer(); }
  else {
    p.rem=left; p.scored+=n; p.hist.unshift(n);
    if(n===180) showOv('180','ONE HUNDRED AND EIGHTY!',p.name,3500);
    if(left===0){ save(); legWon(p); save(); render(); return; }
    say(n===180?'One hundred and eighty!':`${n}`+(left<=170&&checkout(left)&&G.doubleOut?`. ${p.name}, du mangler ${left}`:''));
    nextPlayer();
  }
  p.hist=p.hist.slice(0,6); entry=''; save(); render();
}

// Pil for pil (felt-knapper)
const turnSum = G => (G.turn||[]).reduce((a,d)=>a+d.v,0);
const liveRem = (G,i) => i===G.cur ? G.P[i].rem - turnSum(G) : G.P[i].rem;
function addDart(m,n){
  const G=S.G; if(!G||G.winner||G.game==='cricket') return;
  if(!G.turn) G.turn=[];
  if(!G.turn.length) snap();
  const p=G.P[G.cur];
  const v = n===25 ? (m===2?50:25) : n*m;
  const l = n===0 ? 'Miss' : n===25 ? (m===2?'Bull':'25') : (m===3?'T':m===2?'D':'')+n;
  G.turn.push({l,v,dbl:m===2});
  const sum=turnSum(G), left=p.rem-sum;
  const bust = left<0 || (G.doubleOut && left===1) || (left===0 && G.doubleOut && m!==2);
  if(bust){ p.darts+=G.turn.length; p.hist.unshift('BUST'); p.hist=p.hist.slice(0,6); toast('BUST!'); say(`Bust! ${p.name} mangler stadig ${p.rem}`); nextPlayer(); save(); render(); return; }
  if(left===0){ p.darts+=G.turn.length; p.scored+=sum; p.rem=0; p.hist.unshift(sum); p.hist=p.hist.slice(0,6); G.turn=[]; save(); legWon(p); save(); render(); return; }
  if(G.turn.length>=3){ commitTurn(true); return; }
  save(); render();
}
function commitTurn(auto){
  const G=S.G; if(!G||G.winner||G.game==='cricket') return;
  const p=G.P[G.cur];
  if(!G.turn||!G.turn.length){ if(auto) return; snap(); }
  const sum=turnSum(G), n=(G.turn||[]).length;
  p.rem-=sum; p.scored+=sum; p.darts+=3; p.hist.unshift(sum); p.hist=p.hist.slice(0,6);
  if(sum===180) showOv('180','ONE HUNDRED AND EIGHTY!',p.name,3500);
  say(sum===180?'One hundred and eighty!':`${sum}`+(p.rem<=170&&G.doubleOut&&checkout(p.rem)?`. ${p.name}, du mangler ${p.rem}`:''));
  nextPlayer(); save(); render();
}
function undoDart(){
  const G=S.G; if(G&&G.turn&&G.turn.length){ G.turn.pop(); if(!G.turn.length) S.H.pop(); save(); render(); } else undo();
}

// Cricket
let mult=1;
function crDart(n,m){
  const G=S.G; if(!G||G.winner||G.game!=='cricket') return;
  if(G.darts===0) snap();
  const p=G.P[G.cur]; p.darts++; G.darts++;
  if(n){
    if(n===25&&m===3) m=2;
    const add=Math.min(3-p.marks[n],m), extra=m-add; p.marks[n]+=add;
    if(extra>0 && G.P.some(o=>o!==p&&o.marks[n]<3)) p.pts+=extra*n;
    p.hist.unshift((m===3?'T':m===2?'D':'')+(n===25?'Bull':n));
  } else p.hist.unshift('–');
  p.hist=p.hist.slice(0,6); mult=1;
  if(CR.every(c=>p.marks[c]>=3) && G.P.every(o=>o===p||p.pts>=o.pts)){ save(); legWon(p); save(); render(); return; }
  if(G.darts>=3) nextPlayer();
  save(); render();
}
function crEndTurn(){ const G=S.G; if(!G||G.game!=='cricket') return; if(G.darts===0) snap(); nextPlayer(); save(); render(); }
function parseCricket(txt){
  const t=' '+txt.toLowerCase().replace(/[^a-zæøå0-9 ]/g,' ')+' ';
  const toks=t.split(/\s+/).filter(Boolean); const darts=[]; let m=1;
  const NUM={femten:15,seksten:16,sytten:17,atten:18,nitten:19,tyve:20,bull:25,bul:25,bulls:25,bullseye:25,bullet:25,bold:25};
  for(const k of toks){
    if(/^(single|enkelt|enkel)$/.test(k)) m=1;
    else if(/^(dobbelt|dobbel|double|dobbelte)$/.test(k)) m=2;
    else if(/^(triple|tripel|trippel|tredobbelt|treble)$/.test(k)) m=3;
    else if(/^(miss|mis|forbi|ingenting|nul|udenfor)$/.test(k)){ darts.push([0,1]); m=1; }
    else if(k in NUM){ darts.push([NUM[k],m]); m=1; }
    else if(/^[sdt]\d+$/.test(k)){ const v=+k.slice(1), mm={s:1,d:2,t:3}[k[0]]; darts.push([(v>=15&&v<=20)||v===25?v:0, mm]); m=1; }
    else if(/^\d+$/.test(k)){ const v=+k; darts.push([(v>=15&&v<=20)||v===25?v:(v===50?25:0), v===50?2:m]); m=1; }
    else if(k in W){ darts.push([0,1]); m=1; }
  }
  return darts.slice(0,3);
}

/* ---------- Stemme: genkendelse + kalder ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition; let rec=null, speaking=false, speakEnd=0, heard='';
function toggleVoice(){
  if(!SR) return toast('Stemme virker kun i Chrome eller Edge');
  S.voice=!S.voice; if(S.voice) startRec(); else { try{rec&&rec.abort();}catch(e){} }
  render();
}
function startRec(){
  if(!S.voice) return;
  if(!rec){ rec=new SR(); rec.lang='da-DK'; rec.continuous=true; rec.interimResults=false; rec.maxAlternatives=3;
    rec.onresult=e=>{ if(speaking||Date.now()-speakEnd<900) return; const r=e.results[e.results.length-1]; const txt=r[0].transcript.trim(); heard=txt; handleVoice(txt,[...r].map(a=>a.transcript)); };
    rec.onend=()=>{ if(S.voice) setTimeout(startRec,150); };
    rec.onerror=e=>{ if(e.error==='not-allowed'){ S.voice=false; toast('Giv adgang til mikrofonen'); render(); } };
  }
  try{ rec.start(); }catch(e){}
}
function handleVoice(txt,alts){
  const l=txt.toLowerCase();
  if(/fortryd|undo|fejl/.test(l)){ undo(); return; }
  if(!S.G||S.phase!=='play'){ render(); return; }
  if(S.G.game==='cricket'){
    if(/næste|færdig|videre/.test(l)&&!parseCricket(l).length){ crEndTurn(); return; }
    let darts=parseCricket(l); if(!darts.length) for(const a of alts){ darts=parseCricket(a); if(darts.length) break; }
    if(!darts.length){ toast(`Forstod ikke: "${txt}"`); render(); return; }
    const who=S.G.cur; darts.forEach(([n,m])=>{ if(S.G.cur===who && !S.G.winner) crDart(n,m); });
    if(S.G.cur===who && !S.G.winner) crEndTurn();
  } else {
    if(/bust|død/.test(l)){ submitScore(0); return; }
    let n=daNum(txt); if(n==null) for(const a of alts){ n=daNum(a); if(n!=null) break; }
    if(n==null){ toast(`Forstod ikke: "${txt}"`); render(); return; }
    submitScore(n);
  }
}
function say(text){
  if(!S.caller||!window.speechSynthesis) return;
  const u=new SpeechSynthesisUtterance(text); u.lang='da-DK'; u.rate=1.05;
  const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.startsWith('da')); if(v) u.voice=v;
  // Mikrofonen kører videre (så Chrome ikke spørger igen) – vi ignorerer bare det den hører mens kalderen taler
  speaking=true;
  u.onend=u.onerror=()=>{ speaking=false; speakEnd=Date.now(); };
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}

/* ---------- UI-hjælpere ---------- */
let entry='', tT=null, ovT=null;
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(tT); tT=setTimeout(()=>t.classList.remove('show'),1800); }
function showOv(big,t1,t2,ms){ document.getElementById('ovBig').textContent=big; document.getElementById('ovT1').textContent=t1; document.getElementById('ovT2').textContent=t2; const o=document.getElementById('ov'); o.classList.remove('show'); void o.offsetWidth; o.classList.add('show'); clearTimeout(ovT); if(ms) ovT=setTimeout(hideOv,ms); }
function hideOv(){ document.getElementById('ov').classList.remove('show'); }
function fs(){ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(()=>{}); }
function key(k){
  if(k==='ok'){ if(entry==='') return; submitScore(+entry); return; }
  if(k==='del'){ entry=entry.slice(0,-1); }
  else if(entry.length<3){ entry=(entry+k).replace(/^0(?=\d)/,''); }
  renderDisp();
}
document.addEventListener('keydown',e=>{
  if(S.phase!=='play'||e.target.tagName==='INPUT') return;
  if(S.G&&S.G.game!=='cricket'){
    if(/^\d$/.test(e.key)) key(e.key); else if(e.key==='Backspace') key('del'); else if(e.key==='Enter') key('ok');
  }
  if((e.metaKey||e.ctrlKey)&&e.key==='z'){ e.preventDefault(); undo(); }
});

/* ---------- Render ---------- */
function render(){ S.phase==='setup'?renderSetup():renderPlay(); }
function renderSetup(){
  const all=[...PRESET,...S.extra];
  document.getElementById('app').innerHTML=`<div class="wrap"><div class="setup">
    <div style="text-align:center"><h1 class="gold" style="font-size:46px">🎯 Dart Scorer</h1><div class="muted">Sig din score – eller tast den ind</div></div>
    <div class="card"><div class="lbl">Spil</div><div class="games">${['501','301','cricket'].map(g=>`<button class="${S.game===g?'sel':''}" onclick="S.game='${g}';save();render()">${g==='cricket'?'Cricket':g}</button>`).join('')}</div></div>
    <div class="card"><div class="lbl">Spillere (tryk i den rækkefølge de skal kaste)</div>
      <div class="chips">${all.map(n=>{ const i=S.sel.indexOf(n); return `<button class="chip ${i>=0?'sel':''}" onclick="togglePl('${esc(n)}')">${esc(n)}${i>=0?`<span class="n">${i+1}</span>`:''}</button>`; }).join('')}</div>
      <div class="row" style="margin-top:12px"><input class="txt" id="newp" placeholder="Tilføj spiller…" onkeydown="if(event.key==='Enter')addPl()"><button class="btn" onclick="addPl()">Tilføj</button></div></div>
    <div class="card"><div class="row" style="gap:18px">
      ${S.game!=='cricket'?`<div><div class="lbl">Udgang</div><div class="row"><button class="btn ${S.doubleOut?'on':''}" onclick="S.doubleOut=true;save();render()">Double out</button><button class="btn ${!S.doubleOut?'on':''}" onclick="S.doubleOut=false;save();render()">Single out</button></div></div>`:''}
      <div><div class="lbl">Først til (sæt)</div><div class="row">${[1,2,3,4,5].map(n=>`<button class="btn ${(S.setsToWin||1)===n?'on':''}" onclick="S.setsToWin=${n};save();render()">${n}</button>`).join('')}</div></div>
      <div><div class="lbl">Først til (legs)${(S.setsToWin||1)>1?' pr. sæt':''}</div><div class="row">${[1,2,3,5].map(n=>`<button class="btn ${S.legsToWin===n?'on':''}" onclick="S.legsToWin=${n};save();render()">${n}</button>`).join('')}</div></div>
    </div></div>
    <button class="btn pri" style="padding:18px;font-size:24px" onclick="startGame()">Start ${S.game==='cricket'?'Cricket':S.game} ▶</button>
    ${S.G&&!S.G.winner?`<button class="btn ghost" onclick="S.phase='play';save();render()">↩ Fortsæt igangværende kamp</button>`:''}
  </div></div>`;
}
function togglePl(n){ const i=S.sel.indexOf(n); if(i>=0) S.sel.splice(i,1); else S.sel.push(n); save(); render(); }
function addPl(){ const v=document.getElementById('newp').value.trim(); if(!v) return; if(!S.extra.includes(v)&&!PRESET.includes(v)) S.extra.push(v); if(!S.sel.includes(v)) S.sel.push(v); save(); render(); }

function renderPlay(){
  const G=S.G, cr=G.game==='cricket';
  document.getElementById('app').innerHTML=`<div class="wrap">
    <div class="top"><div><h1><span class="gold">${cr?'Cricket':G.game}</span> <span class="muted" style="font-size:22px">· ${(G.setsToWin||1)>1?`Sæt ${G.set} · `:''}Leg ${G.leg} · ${(G.setsToWin||1)>1?`først til ${G.setsToWin} sæt à ${G.legsToWin} legs`:`først til ${G.legsToWin}`}${!cr?' · '+(G.doubleOut?'double out':'single out'):''}</span></h1></div>
      <div class="row">
        <button class="btn ${S.voice?'on':''}" onclick="toggleVoice()">🎤 ${S.voice?'Lytter':'Stemme'}</button>
        <button class="btn ${S.caller?'on':''}" onclick="S.caller=!S.caller;save();render()">🔊 Kalder</button>
        <button class="btn" onclick="undo()">↺ Fortryd</button>
        <button class="btn" onclick="fs()">⛶</button>
        <button class="btn" onclick="if(confirm('Afslut kampen og gå til opsætning?')){S.phase='setup';save();render();}">Ny kamp</button>
      </div></div>
    <div class="play"><div>${cr?crBoard():x01Board()}</div><div class="inp">${voiceBox()}${cr?crInput():x01Input()}</div></div></div>`;
}
const legsDots=p=>`<span style="display:inline-flex;align-items:center">${(S.G.setsToWin||1)>1?`<span class="setb">Sæt ${p.sets||0}</span>`:''}<span class="legs">${[...Array(S.G.legsToWin)].map((_,i)=>`<i class="${i<p.legs?'w':''}"></i>`).join('')}</span></span>`;
function x01Board(){
  const G=S.G;
  return `<div class="board">${G.P.map((p,i)=>{ const act=i===G.cur&&!G.winner, rem=liveRem(G,i), co=G.doubleOut?checkout(rem, act?3-(G.turn||[]).length:3):null, avg=p.darts?(p.scored/p.darts*3).toFixed(1):'–';
    return `<div class="pl ${act?'act':''}">${act?'<span class="turnarrow">KASTER</span>':''}
      <div class="nm">${esc(p.name)} ${G.legsToWin>1||(G.setsToWin||1)>1?legsDots(p):''}</div>
      <div class="rem">${rem}</div>
      <div class="stats"><span>Snit <b>${avg}</b></span><span>Pile <b>${p.darts}</b></span><span>Sidst <b>${p.hist[0]??'–'}</b></span></div>
      ${co?`<div class="co">🎯 ${co.join(' · ')}</div>`:''}
      ${p.hist.length>1?`<div class="hist">${p.hist.slice(1).join(' · ')}</div>`:''}</div>`; }).join('')}</div>`;
}
function voiceBox(){
  const G=S.G, p=G.P[G.cur], cr=G.game==='cricket';
  return `<div class="voice ${S.voice?'on':''}"><div class="st"><span class="dot"></span>${S.voice?`Sig ${esc(p.name)}s ${cr?'pile – fx “triple tyve, nitten, miss”':'score – fx “hundrede og fyrre”'}`:'Tryk 🎤 Stemme for at sige scoren'}</div>
    ${location.protocol==='file:'&&S.voice?'<div class="heard" style="color:var(--gold)">Tip: Åbn via “Start dart.command”, så husker Chrome mikrofonen</div>':''}<div class="heard">${heard?`Hørte: “${esc(heard)}”`:(SR?'Sig “fortryd” for at fortryde':'Stemme kræver Chrome eller Edge')}</div></div>`;
}
function x01Input(){
  const mode=S.mode||'fields';
  const tabs=`<div class="mult"><button class="${mode==='fields'?'sel':''}" onclick="S.mode='fields';save();render()">🎯 Felter</button><button class="${mode==='total'?'sel':''}" onclick="S.mode='total';save();render()">🔢 Total</button><button onclick="undoDart()">⌫ Fortryd</button></div>`;
  if(mode==='fields'){
    const G=S.G, t=G.turn||[], sum=turnSum(G);
    const row=(m,lbl,cls)=>`<div class="fl">${lbl}</div><div class="fg ${cls}">${[...Array(20)].map((_,i)=>`<button onclick="addDart(${m},${i+1})">${i+1}</button>`).join('')}</div>`;
    return tabs+`<div class="turnbox">${[0,1,2].map(i=>`<span class="${t[i]?'f':''}">${t[i]?t[i].l:'–'}</span>`).join('')}<b>${sum}</b></div>
      <div>${row(1,'Single','s')}${row(2,'Double','d')}${row(3,'Triple','t')}</div>
      <div class="fx"><button onclick="addDart(1,25)">25</button><button class="bull" onclick="addDart(2,25)">Bull</button><button class="miss" onclick="addDart(1,0)">Miss</button></div>
      <button class="btn" style="padding:13px;font-size:18px" onclick="commitTurn()">Næste spiller ▶</button>`;
  }
  return tabs+`<div class="disp" id="disp">${entry||'<span class="muted">0</span>'}</div>
    <div class="keys">${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="key('${n}')">${n}</button>`).join('')}<button class="del" onclick="key('del')">⌫</button><button onclick="key('0')">0</button><button class="ok" onclick="key('ok')">OK</button></div>
    <div class="quick">${[0,26,41,45,60,81,85,100,140,180].map(n=>`<button onclick="submitScore(${n})">${n}</button>`).join('')}</div>`;
}
function renderDisp(){ const d=document.getElementById('disp'); if(!d) return; const n=+entry; d.innerHTML=entry||'<span class="muted">0</span>'; d.classList.toggle('err', entry!==''&&(n>180||IMPOSSIBLE.has(n))); }
const MK=['','/','✕','Ⓧ'];
function crBoard(){
  const G=S.G;
  const allClosed=c=>G.P.every(p=>p.marks[c]>=3);
  return `<table class="cr"><thead><tr><th></th>${G.P.map((p,i)=>`<th class="${i===G.cur&&!G.winner?'act':''}">${i===G.cur&&!G.winner?'▶ ':''}${esc(p.name)} ${G.legsToWin>1||(G.setsToWin||1)>1?legsDots(p):''}</th>`).join('')}</tr></thead><tbody>
    ${CR.map(c=>`<tr class="${allClosed(c)?'closed':''}"><td class="num">${c===25?'Bull':c}</td>${G.P.map((p,i)=>`<td class="${i===G.cur?'act':''}"><span class="mk ${p.marks[c]>=3?'m3':''}">${MK[Math.min(3,p.marks[c])]}</span></td>`).join('')}</tr>`).join('')}
    <tr class="pts"><td class="num" style="font-size:22px">Point</td>${G.P.map((p,i)=>`<td class="${i===G.cur?'act':''}">${p.pts}</td>`).join('')}</tr></tbody></table>
    <div class="muted" style="margin-top:6px">${G.P.map(p=>`${esc(p.name)}: ${p.hist.join(' · ')||'–'}`).join(' &nbsp;|&nbsp; ')}</div>`;
}
function crInput(){
  const G=S.G;
  return `<div class="dts">${[0,1,2].map(i=>`<i class="${i<G.darts?'u':''}"></i>`).join('')} <span>pil ${Math.min(G.darts+1,3)} af 3</span></div>
    <div class="mult">${[[1,'Single'],[2,'Double'],[3,'Triple']].map(([m,l])=>`<button class="${mult===m?'sel':''}" onclick="mult=${m};render()">${l}</button>`).join('')}</div>
    <div class="crk">${[20,19,18,17,16,15].map(n=>`<button onclick="crDart(${n},mult)">${n}</button>`).join('')}<button onclick="crDart(25,mult)">Bull</button><button class="miss" onclick="crDart(0,1)">Miss</button></div>
    <button class="btn" style="padding:14px;font-size:18px" onclick="crEndTurn()">Afslut tur ▶</button>`;
}
if(window.speechSynthesis) speechSynthesis.onvoiceschanged=()=>{};
render();
</script>
