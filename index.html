<style>

/* ---------- STORSKÆRM ---------- */
body.display{font-size:clamp(11px,1.32vw,42px);height:100vh;overflow:hidden}

.screen h1{margin:0;font-size:3.2rem;font-weight:800;letter-spacing:.02em;text-transform:uppercase;display:flex;align-items:center;gap:.5rem}
.cake{display:inline-block;animation:wob 2.4s ease-in-out infinite;transform-origin:50% 90%}
@keyframes wob{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.gold{background:linear-gradient(90deg,#ffcf4a,#fff3c4,#ff9f43,#ffcf4a);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:300% 0}}
#confetti{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;pointer-events:none}
.bunting{position:fixed;top:0;left:0;right:0;z-index:2;display:flex;justify-content:space-between;pointer-events:none;padding:0 .5rem}
.bunting::before{content:'';position:absolute;left:0;right:0;top:0;height:2px;background:rgba(255,255,255,.35)}

.track{display:inline-block;padding-left:100%;animation:scroll var(--dur,40s) linear infinite}
@keyframes scroll{to{transform:translateX(-100%)}}
.score{display:inline-block}
.bump{animation:bump .9s ease-out}
@keyframes bump{0%{transform:scale(1.45);color:var(--gold);text-shadow:0 0 1.5rem var(--gold)}100%{transform:scale(1)}}
.screen h1 .dot{display:inline-block;width:.8em;height:.8em;border-radius:50%;background:radial-gradient(circle,var(--red) 0 22%,#fff 23% 40%,var(--green) 41% 62%,#111 63%);vertical-align:-.08em;margin-right:.35em}
#clock{font-family:'Barlow Condensed';font-size:2.6rem;font-weight:700;color:var(--muted)}
.cols{flex:1;display:grid;grid-template-columns:1.45fr 1fr;gap:1.4rem;min-height:0}
.t.men{border-top:.3rem solid var(--pink)}.t.women{border-top:.3rem solid var(--cyan)}

.thead{display:flex;align-items:baseline;justify-content:space-between}

.fmt{color:var(--muted);font-size:1.1rem;font-weight:600}

.now.live{border-left-color:var(--live)}

body.isfs .fs{display:none}

/* ---------- INDTASTNING ---------- */
body.admin{font-size:16px}

.adm table.st{font-size:15px;margin-top:10px}

.am .sets{grid-column:2/-1;font-size:12px;color:var(--muted)}
</style>

<body>
<div id="app"></div>
<script>
const KEY = 'dart-turnering-v3';

function mk(pairs){ return pairs.map(([a,b])=>({a,b,legs:[],live:false})); }
const newFinal = () => ({a:null,b:null,legs:[],live:false,isFinal:true});
function defaults(){
  return {
    title: 'Hartvigs Fødselsdagsturnering',
    msg: 'Tillykke med fødselsdagen, Hartvig! 🎂🎉   ✦   🍻 SKÅÅÅÅL!   ✦   🎯🎯🎯 ONE HUNDRED AND EIGHTYYYYY! 180!   ✦   🧅 Sømand har lange løg   ✦   🤘 Annette elsker god rock   ✦   💨 Stefan stinker   ✦   😂 Det er en MORTEN!   ✦   🍻 SKÅÅÅÅL!   ✦   📺 PaulaSmaula har 5 seje followers på YouTube   ✦   🥦 Harbo er tosset med grøntsager og GRØN TUBORG 0.0%   ✦   💃 Jeanette!! Står du nu IGEN og danser med dig selv?   ✦   🍻 SKÅÅÅÅL!   ✦   🌵🥃 Tequila, da da da da da da da… TEQUILA!   ✦   🎯 Hartvig smider altid pilen ved siden af   ✦   🎵🎶 Alle sømænd er glade for Annette 🎶🎵   ✦   👑 Paula er Cricket-dronningen – bow down!   ✦   😂 Det er en MORTEN!   ✦   🍻 SKÅÅÅÅL!   ✦   🔥 Hvem kaster aftenens første 180? 🔥   ✦   📣 Stefan RÅBER: Der kommer KÅÅÅL!   ✦   🎯 Harbo kaster altid triple 20   ✦   🎧 Paula STOP med at skifte sang – brug playlisten!   ✦   🪩 Jeanette har dansegulvet for sig selv – DJ, skru op!   ✦   🍻 SKÅÅÅÅL!   ✦   ⛴️ Fuck en fed færge!   ✦   🎯 T20 · T20 · T20 = 180 – så nemt er det!   ✦   🎢 Renette siger Weeeeeeee!   ✦   😂 Det er en MORTEN!   ✦   🍻 SKÅÅÅÅL!',
    log180: [], e180: null,
    men: {
      name:'Herrer', game:'501', sets:3, legsPerSet:3, perRound:2, fSets:3, fLegs:3, final:newFinal(),
      players:['Hartvig','Stefan','Sømand','Harbo'],
      // Stefan (1) spiller ikke kamp 1
      matches: mk([[0,2],[3,1], [2,3],[1,0], [0,3],[2,1]])
    },
    women: {
      name:'Damer', game:'Cricket', sets:1, legsPerSet:3, perRound:1, fSets:1, fLegs:3, final:newFinal(),
      players:['Paula','Annette','Jeanette'],
      matches: mk([[0,1],[2,0],[1,2]])
    }
  };
}
function fix(s){ const d=defaults(); if(!s.log180) s.log180=[]; if(s.e180===undefined) s.e180=null; ['men','women'].forEach(k=>{ const t=s[k]; if(!t.final) t.final=newFinal(); if(!t.fSets) t.fSets=d[k].fSets; if(!t.fLegs) t.fLegs=d[k].fLegs; }); return s; }
function load(){ try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s && s.men && s.women) return fix(s); }catch(e){} return defaults(); }
let S = load();
if(!S.msg || ['Tillykke med fødselsdagen, Hartvig! 🎂🎉   ✦   🍻 SKÅÅÅÅL!   ✦   🧅 Sømand har lange løg   ✦   💨 Stefan lugter ofte af prut   ✦   🍻 SKÅÅÅÅL!   ✦   ⛴️ Fuck en fed færge!   ✦   🤘 Annette elsker god rock   ✦   🍻 SKÅÅÅÅL!   ✦   📺 PaulaSmaula har 5 seje followers på YouTube   ✦   🥦 Harbo elsker grøntsager og GRØN TUBORG 0.0%   ✦   🍻 SKÅÅÅÅL!   ✦   💃 Jeanette!! Står du nu IGEN og danser med dig selv?   ✦   🍻 SKÅÅÅÅL!','Tillykke med fødselsdagen, Hartvig! 🎂🎉','Tillykke med fødselsdagen, Hartvig! 🎂🎉   ✦   🧅 Sømand har lange løg   ✦   💨 Stefan lugter ofte af prut   ✦   ⛴️ Fuck en fed færge!   ✦   🤘 Annette elsker god rock'].includes(S.msg)) S.msg=defaults().msg;
if(S.title==='Dartturnering') S.title='Hartvigs Fødselsdagsturnering';
let bc = null; try{ bc = new BroadcastChannel(KEY); bc.onmessage = ()=>{ S = load(); render(); }; }catch(e){}
window.addEventListener('storage', e=>{ if(e.key===KEY){ S = load(); render(); } });
function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} try{ bc && bc.postMessage(1); }catch(e){} }

const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const need = n => Math.floor(n/2)+1;
const hasSets = t => t.sets>1;
const fmtOf = (t,m) => m && m.isFinal ? {sets:t.fSets, legsPerSet:t.fLegs} : t;
const getM = (t,idx) => idx<0 ? t.final : t.matches[idx];
const groupDone = t => t.matches.every(m=>calc(t,m).done);
// Finalister: nr. 1 og 2 i stillingen, når alle gruppekampe er spillet (låses ved første leg i finalen)
function finalists(t){ if(t.final.a!=null) return [t.final.a,t.final.b]; if(!groupDone(t)) return null; const r=standings(t); return [r[0].i,r[1].i]; }

// Udled sæt/legs ud fra rækkefølgen af vundne legs (m.legs = ['a','b',...])
function calc(t0,m){
  const t=fmtOf(t0,m); const ln=need(t.legsPerSet), sn=need(t.sets);
  let sa=0,sb=0,ca=0,cb=0,la=0,lb=0; const sets=[];
  for(const w of m.legs){
    if(w==='a'){ca++;la++;} else {cb++;lb++;}
    if(ca>=ln||cb>=ln||ca+cb>=t.legsPerSet){ sets.push([ca,cb]); if(ca>cb)sa++; else if(cb>ca)sb++; ca=0; cb=0; }
  }
  const done = sa>=sn || sb>=sn || sets.length>=t.sets;
  // Hovedscore: sæt hvis der spilles sæt, ellers legs
  const A = hasSets(t)?sa:la, B = hasSets(t)?sb:lb;
  return {sa,sb,ca,cb,la,lb,sets,done,A,B};
}
const status = (t,m) => calc(t,m).done ? 'done' : (m.live || m.legs.length) ? 'live' : 'pending';

function standings(t){
  const r = t.players.map((name,i)=>({i,name,k:0,v:0,u:0,t:0,sf:0,sa:0,lf:0,la:0,p:0}));
  t.matches.forEach(m=>{
    const c=calc(t,m), A=r[m.a], B=r[m.b];
    A.lf+=c.la; A.la+=c.lb; B.lf+=c.lb; B.la+=c.la;
    A.sf+=c.sa; A.sa+=c.sb; B.sf+=c.sb; B.sa+=c.sa;
    if(!c.done) return;
    A.k++; B.k++;
    if(c.A>c.B){ A.v++; A.p+=2; B.t++; } else if(c.B>c.A){ B.v++; B.p+=2; A.t++; } else { A.u++; B.u++; A.p++; B.p++; }
  });
  const h2h=(x,y)=>{ const m=t.matches.find(m=>calc(t,m).done&&((m.a===x.i&&m.b===y.i)||(m.a===y.i&&m.b===x.i))); if(!m) return 0; const c=calc(t,m); return m.a===x.i ? c.B-c.A : c.A-c.B; };
  return r.sort((x,y)=> y.p-x.p || (y.sf-y.sa)-(x.sf-x.sa) || (y.lf-y.la)-(x.lf-x.la) || y.lf-x.lf || h2h(x,y) || x.name.localeCompare(y.name,'da'));
}
function rounds(t){
  const out=[];
  for(let i=0;i<t.matches.length;i+=t.perRound){
    const ms=t.matches.slice(i,i+t.perRound).map((m,j)=>({m,idx:i+j}));
    const playing=new Set(ms.flatMap(x=>[x.m.a,x.m.b]));
    out.push({n:out.length+1,ms,bye:t.players.map((n,k)=>k).filter(k=>!playing.has(k))});
  }
  return out;
}
const sgn = d => d>0?'+'+d:d;
function tableHTML(t){
  const rows=standings(t), anyDone=t.matches.some(m=>calc(t,m).done), s=hasSets(t);
  return `<table class="st"><thead><tr><th></th><th>Spiller</th><th>K</th><th>V</th><th>T</th>${s?'<th>Sæt</th>':''}<th>Legs</th><th>+/−</th><th>P</th></tr></thead><tbody>${
    rows.map((r,i)=>`<tr class="${i===0&&anyDone?'lead':''}"><td class="pos">${i+1}</td><td class="n">${esc(r.name)}</td><td>${r.k}</td><td>${r.v}</td><td>${r.t}</td>${s?`<td>${r.sf}-${r.sa}</td>`:''}<td>${r.lf}-${r.la}</td><td>${sgn(s?r.sf-r.sa:r.lf-r.la)}</td><td class="p">${r.p}</td></tr>`).join('')
  }</tbody></table>`;
}
const fmtText = t => hasSets(t) ? `Bedst af ${t.sets} sæt · bedst af ${t.legsPerSet} legs pr. sæt` : `Bedst af ${t.legsPerSet} legs`;
const setList = c => c.sets.map(([a,b])=>`${a}-${b}`).join(', ');

/* ---------- STORSKÆRM ---------- */
function renderDisplay(){
  document.body.className='display';
  const app=document.getElementById('app');
  if(!document.getElementById('clock')){
    const cols=['#ffcf4a','#ff5fa2','#38d9f0','#22c993','#a77bff'];
    app.innerHTML=`<canvas id="confetti"></canvas><div class="bunting">${Array.from({length:40},(_,i)=>`<i style="background:${cols[i%5]};animation-delay:${-(i%7)*.4}s"></i>`).join('')}</div>
      <div class="screen"><header><h1><span class="cake">🎂</span><span id="ttl" class="gold"></span><span>🎯</span></h1><div class="hdr-r"><button class="fs" onclick="toggleFS()" title="Tast F for fuld skærm">⛶ Fuld skærm</button><div id="clock"></div></div></header>
      <div class="cols"><section class="t men" id="d-men"></section><section class="t women" id="d-women"></section></div>
      <div class="ticker"><div class="track" id="ticker"></div></div></div>
      <div id="o180"><div class="big" id="o180big">180</div><div class="t1" id="o180t1">ONE HUNDRED AND EIGHTY!</div><div class="who" id="o180who"></div><div class="cnt" id="o180cnt"></div></div>`;
    tick(); setInterval(tick,10000); startConfetti();
  }
  document.getElementById('ttl').textContent=S.title;
  document.getElementById('d-men').innerHTML=dispT(S.men,true,'men');
  document.getElementById('d-women').innerHTML=dispT(S.women,false,'women');
  // Rulletekst (opdateres kun når teksten ændres, så den ikke hopper)
  const tk=`🎂 ${S.msg}   ✦   🎯 ${S.men.name}: ${S.men.game} · ${fmtText(S.men)}   ✦   🎯 ${S.women.name}: ${S.women.game} · ${fmtText(S.women)}   ✦   🍻 SKÅÅÅÅL og god fornøjelse!`;
  const tr=document.getElementById('ticker');
  if(tr.dataset.t!==tk){ tr.dataset.t=tk; tr.textContent=tk; tr.style.setProperty('--dur',Math.max(20,tk.length*0.28)+'s'); }
  // Animationer: score-bump, konfetti ved kampsejr og turneringssejr
  document.querySelectorAll('.now.live').forEach(el=>{ const k=el.dataset.k, v=el.dataset.s; if(prevScore[k]!==undefined && prevScore[k]!==v){ const sc=el.querySelector('.score'); sc.classList.remove('bump'); void sc.offsetWidth; sc.classList.add('bump'); } prevScore[k]=v; });
  const doneN=[S.men,S.women].reduce((n,t)=>n+t.matches.filter(m=>calc(t,m).done).length,0);
  const champs=[S.men,S.women].filter(t=>t.final.a!=null && calc(t,t.final).done).length;
  if(prevDone!==null){ if(champs>prevChamps) burst(450); else if(doneN>prevDone) burst(160); }
  prevDone=doneN; prevChamps=champs;
  // 180-show
  const e=S.e180;
  if(e && e.ts!==seen180 && (seen180!==null || Date.now()-e.ts<15000)) show180(e);
  seen180 = e ? e.ts : 0;
}
let seen180=null, hide180=null;
function show180(e){
  const o=document.getElementById('o180');
  const M=e.type==='morten';
  document.getElementById('o180big').textContent=M?'MORTEN':'180';
  document.getElementById('o180t1').textContent=M?'DET ER EN MORTEN!':'ONE HUNDRED AND EIGHTY!';
  document.getElementById('o180who').textContent=(M?'😂 ':'🎯 ')+e.name+(M?' 😂':' 🎯');
  const lbl=M?'MORTEN':'180';
  document.getElementById('o180cnt').textContent=M?'':`${e.name}s ${e.pn}. ${lbl} i aften · aftenens ${lbl} nr. ${e.n}`;
  o.classList.remove('show'); void o.offsetWidth; o.classList.toggle('morten',M); o.classList.add('show');
  const cv=document.getElementById('confetti'); cv.style.zIndex=11;
  burst(500); setTimeout(()=>burst(300),1500); setTimeout(()=>burst(300),3000);
  clearTimeout(hide180); hide180=setTimeout(()=>{ o.classList.remove('show'); setTimeout(()=>cv.style.zIndex=0,400); },7500);
}
const prevScore={}; let prevDone=null, prevChamps=0;
let conf=[];
function startConfetti(){
  const cv=document.getElementById('confetti'), cx=cv.getContext('2d'), cols=['#ffcf4a','#ff5fa2','#38d9f0','#22c993','#a77bff','#ffffff'];
  const fit=()=>{ cv.width=innerWidth; cv.height=innerHeight; }; fit(); addEventListener('resize',fit);
  const piece=(burst)=>({x:Math.random()*cv.width, y:burst?-Math.random()*cv.height*.6:Math.random()*cv.height, w:6+Math.random()*8, h:4+Math.random()*6,
    vy:burst?2+Math.random()*4:.4+Math.random()*.9, vx:(Math.random()-.5)*(burst?2.5:.6), r:Math.random()*6, vr:(Math.random()-.5)*.15, c:cols[Math.random()*cols.length|0], burst, a:burst?1:.45});
  for(let i=0;i<70;i++) conf.push(piece(false));
  window.burst=n=>{ for(let i=0;i<n;i++) conf.push(piece(true)); };
  (function loop(){
    cx.clearRect(0,0,cv.width,cv.height);
    conf=conf.filter(p=>{ p.y+=p.vy; p.x+=p.vx+Math.sin(p.y/40)*.3; p.r+=p.vr;
      if(p.y>cv.height+20){ if(p.burst) return false; p.y=-20; p.x=Math.random()*cv.width; }
      cx.save(); cx.globalAlpha=p.a; cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle=p.c; cx.fillRect(-p.w/2,-p.h/2,p.w,p.h); cx.restore(); return true; });
    requestAnimationFrame(loop);
  })();
}
function burst(){}
function dispT(t,two,key){
  const P=t.players; const all=t.matches.map((m,idx)=>({m,idx,st:status(t,m)}));
  const live=all.filter(x=>x.st==='live'); const next=all.find(x=>x.st==='pending');
  let now='';
  if(live.length) now=live.map(({m,idx})=>{ const c=calc(t,m);
    const sub = hasSets(t) ? `<div class="sub">Sæt ${c.sets.length+1}: legs ${c.ca} – ${c.cb}${c.sets.length?` <span>(${setList(c)})</span>`:''}</div>` : '';
    return `<div class="now live" data-k="${key}${idx}" data-s="${c.A}-${c.B}-${c.ca}-${c.cb}"><span class="tag">SPILLES NU</span><div class="nm">${esc(P[m.a])}</div><div class="mid"><div class="score">${c.A} – ${c.B}</div>${sub}</div><div class="nm b">${esc(P[m.b])}</div></div>`; }).join('');
  if(groupDone(t)){
    const f=finalists(t), F=t.final, st=F.a!=null?status(t,F):'pending', c=calc(t,F), fs=hasSets(fmtOf(t,F));
    if(st==='done'){ const w=c.A>c.B?f[0]:f[1]; now=`<div class="champ"><small>${esc(t.name.toUpperCase())} · VINDER AF FINALEN</small>👑 ${esc(P[w])} 🏆</div>`; }
    else { const sub = st==='live'&&fs ? `<div class="sub">Sæt ${c.sets.length+1}: legs ${c.ca} – ${c.cb}${c.sets.length?` <span>(${setList(c)})</span>`:''}</div>` : '';
      now=`<div class="now final ${st==='live'?'live':''}" data-k="${key}F" data-s="${c.A}-${c.B}-${c.ca}-${c.cb}"><span class="tag">🏆 FINALE${st==='live'?' · SPILLES NU':''}</span><div class="nm">${esc(P[f[0]])}</div><div class="mid">${st==='live'?`<div class="score">${c.A} – ${c.B}</div>`:'<div class="score vs">VS</div>'}${sub}</div><div class="nm b">${esc(P[f[1]])}</div></div>`; }
  }
  else if(next && live.length<t.perRound) now+=`<div class="now"><span class="tag">NÆSTE KAMP</span><div class="nm">${esc(P[next.m.a])}</div><div class="mid"><div class="score vs">VS</div></div><div class="nm b">${esc(P[next.m.b])}</div></div>`;
  const prog = rounds(t).map(r=>`<div class="rnd"><div class="rh">${t.perRound>1?'Runde '+r.n:''}${r.bye.length?(t.perRound>1?' · ':'')+'Over: '+r.bye.map(k=>esc(P[k])).join(', '):''}</div>${
    r.ms.map(({m,idx})=>{ const st=status(t,m), c=calc(t,m); const wa=st==='done'&&c.A>c.B, wb=st==='done'&&c.B>c.A;
      return `<div class="pm ${st}"><span class="no">${idx+1}</span><span class="${wa?'w':''}">${esc(P[m.a])}</span><span class="sc">${st==='pending'?'–':c.A+' – '+c.B}</span><span class="b ${wb?'w':''}">${esc(P[m.b])}</span></div>`; }).join('')
  }</div>`).join('') + finalRow(t);
  return `<div class="thead"><h2>${esc(t.name)}</h2><span class="fmt">${esc(t.game)} · ${fmtText(t)}</span></div>
    <div class="nowwrap">${now}</div>${tableHTML(t)}<h3>Program</h3><div class="prog ${two?'two':''}">${prog}</div>`;
}
function finalRow(t){
  const P=t.players, F=t.final, f=finalists(t), st=F.a!=null?status(t,F):'pending', c=calc(t,F);
  const wa=st==='done'&&c.A>c.B, wb=st==='done'&&c.B>c.A;
  const fm=fmtOf(t,F), ft=hasSets(fm)?`bedst af ${fm.sets} sæt`:`bedst af ${fm.legsPerSet} legs`;
  return `<div class="rnd"><div class="rh fin">🏆 Finale · 1. mod 2. plads · ${ft}</div><div class="pm ${st} finrow"><span class="no">F</span><span class="${wa?'w':''}">${f?esc(P[f[0]]):'1. plads'}</span><span class="sc">${st==='pending'?'–':c.A+' – '+c.B}</span><span class="b ${wb?'w':''}">${f?esc(P[f[1]]):'2. plads'}</span></div></div>`;
}
function tick(){ const c=document.getElementById('clock'); if(c) c.textContent=new Date().toLocaleTimeString('da-DK',{hour:'2-digit',minute:'2-digit'}); }
document.addEventListener('fullscreenchange',()=>document.body.classList.toggle('isfs',!!document.fullscreenElement));
document.addEventListener('keydown',e=>{ if((e.key==='f'||e.key==='F') && location.hash==='#skaerm' && !/INPUT|SELECT/.test(e.target.tagName)) toggleFS(); });
function toggleFS(){ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(()=>{}); }

/* ---------- INDTASTNING ---------- */
function renderAdmin(full){
  document.body.className='admin';
  const app=document.getElementById('app');
  if(full || !document.getElementById('a-men')){
    app.innerHTML=`<div class="adm"><header><h1>🎯 Indtastning</h1><div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn pri" onclick="window.open(location.pathname+'#skaerm','skaerm')">Åbn storskærm ↗</button>
      <button class="btn" onclick="resetAll()">Nulstil turnering</button></div></header>
      <p class="hint">Træk storskærms-vinduet over på TV'et og tryk “Fuld skærm”. Tryk <b>+</b> hver gang en spiller vinder et leg – sæt og kamp tælles automatisk. <b>−</b> fortryder spillerens seneste leg. Alt gemmes i browseren og opdaterer storskærmen med det samme.</p>
      <div class="set">Titel <input style="width:280px" value="${esc(S.title)}" oninput="S.title=this.value;persist()"></div><div class="set">Rulletekst <input style="width:100%;max-width:900px" value="${esc(S.msg)}" oninput="S.msg=this.value;persist()"></div>
      <div class="card c180"><h2>🎯 180 &amp; MORTEN</h2><p class="hint" style="margin:0 0 10px">Tryk på spilleren – så kører et stort show på storskærmen.</p><div class="b180" id="a-180"></div></div>
      <div class="grid2"><div class="card">${settings('men')}<div id="a-men"></div></div><div class="card">${settings('women')}<div id="a-women"></div></div></div></div>`;
  }
  document.getElementById('a-180').innerHTML=admin180();
  document.getElementById('a-men').innerHTML=adminMatches('men');
  document.getElementById('a-women').innerHTML=adminMatches('women');
}
const opts = (arr,v) => arr.map(n=>`<option ${n===v?'selected':''}>${n}</option>`).join('');
function settings(k){
  const t=S[k];
  return `<h2>${esc(t.name)} · ${esc(t.game)}</h2>
   <div class="set">Bedst af <select onchange="S.${k}.sets=+this.value;persist();renderAdmin()">${opts([1,3,5],t.sets)}</select> sæt,
     bedst af <select onchange="S.${k}.legsPerSet=+this.value;persist();renderAdmin()">${opts([1,3,5,7],t.legsPerSet)}</select> legs ${t.sets>1?'pr. sæt':''}</div>
   <div class="set">Navne: ${t.players.map((p,i)=>`<input value="${esc(p)}" oninput="S.${k}.players[${i}]=this.value;persist();renderAdmin()">`).join('')}</div>`;
}
function ctr(k,idx,side,big,small){
  return `<span class="ctr"><button onclick="leg('${k}',${idx},'${side}',-1)">−</button><b>${big}${small!=null?`<i>${small}</i>`:''}</b><button class="plus" onclick="leg('${k}',${idx},'${side}',1)">+</button></span>`;
}
function adminMatches(k){
  const t=S[k], P=t.players, s=hasSets(t);
  const body = rounds(t).map(r=>`<div class="arh">${t.perRound>1?'Runde '+r.n:''}${r.bye.length?(t.perRound>1?' · ':'')+'over: '+r.bye.map(i=>esc(P[i])).join(', '):''}</div>${
    r.ms.map(({m,idx})=>{ const st=status(t,m), c=calc(t,m);
      return `<div class="am ${st}"><span class="no">${idx+1}</span><span class="nm">${esc(P[m.a])}</span>
        ${ctr(k,idx,'a',c.A,s&&!c.done?c.ca:null)}<span style="color:var(--muted)">–</span>${ctr(k,idx,'b',c.B,s&&!c.done?c.cb:null)}
        <span class="nm nb">${esc(P[m.b])}</span>
        <span class="acts">${st==='done'?'<span style="color:var(--green);font-size:13px;font-weight:700">FÆRDIG</span>':`<button class="btn sm" onclick="toggleLive('${k}',${idx})">${st==='live'?'Stop':'Start'}</button>`}<button class="btn sm" title="Nulstil kamp" onclick="clearM('${k}',${idx})">↺</button></span>
        ${s&&c.sets.length?`<span class="sets">Sæt: ${setList(c)}</span>`:''}</div>`; }).join('')
  }`).join('');
  // Finale
  const F=t.final, f=finalists(t), fst=F.a!=null?status(t,F):'pending', fc=calc(t,F), fsets=hasSets(fmtOf(t,F));
  const pre = f ? null : (()=>{ const r=standings(t); return [r[0].i,r[1].i]; })();
  const fin = `<div class="arh fin">🏆 Finale – nr. 1 mod nr. 2 · bedst af <select onchange="S.${k}.fSets=+this.value;persist();renderAdmin()">${opts([1,3,5],t.fSets)}</select> sæt, bedst af <select onchange="S.${k}.fLegs=+this.value;persist();renderAdmin()">${opts([1,3,5,7],t.fLegs)}</select> legs</div>
    ${f ? `<div class="am ${fst} finrow"><span class="no">F</span><span class="nm">${esc(P[f[0]])}</span>
        ${ctr(k,-1,'a',fc.A,fsets&&!fc.done?fc.ca:null)}<span style="color:var(--muted)">–</span>${ctr(k,-1,'b',fc.B,fsets&&!fc.done?fc.cb:null)}
        <span class="nm nb">${esc(P[f[1]])}</span>
        <span class="acts">${fst==='done'?'<span style="color:var(--gold);font-size:13px;font-weight:700">🏆 VINDER</span>':`<button class="btn sm" onclick="toggleLive('${k}',-1)">${fst==='live'?'Stop':'Start'}</button>`}<button class="btn sm" title="Nulstil finale" onclick="clearM('${k}',-1)">↺</button></span>
        ${fsets&&fc.sets.length?`<span class="sets">Sæt: ${setList(fc)}</span>`:''}</div>`
      : `<p class="hint" style="margin:4px 0">Finalen åbner, når alle gruppekampe er spillet. Lige nu: ${esc(P[pre[0]])} mod ${esc(P[pre[1]])} (foreløbig).</p>`}`;
  return (s?'<p class="hint" style="margin:4px 0 0">Stort tal = vundne sæt · lille tal = legs i igangværende sæt</p>':'') + body + fin + tableHTML(t);
}
const typ = x => x.t||'180';
function count180(k,i,t='180'){ return S.log180.filter(x=>x.k===k&&x.i===i&&typ(x)===t).length; }
function admin180(){
  const btns=(k,t)=>S[k].players.map((p,i)=>{ const n=count180(k,i,t); return `<button class="btn180 ${t==='morten'?'mor':''}" onclick="fire180('${k}',${i},'${t}')">${t==='morten'?'MORTEN':'180'} · ${esc(p)}${n&&t!=='morten'?` <small>(${n})</small>`:''}</button>`; }).join('');
  const last=S.log180.at(-1);
  return `<div class="row180">${btns('men','180')}</div>
    <div class="row180">${btns('men','morten')}</div>`
    +(last?`<div class="row180"><button class="btn sm" onclick="undo180()">↺ Fortryd seneste (${typ(last)==='morten'?'MORTEN':'180'} · ${esc(S[last.k].players[last.i])})</button></div>`:'');
}
function fire180(k,i,t='180'){
  S.log180.push({k,i,t});
  S.e180={ts:Date.now(), type:t, name:S[k].players[i], n:S.log180.filter(x=>typ(x)===t).length, pn:count180(k,i,t)};
  persist(); render();
}
function undo180(){ if(!S.log180.length || !confirm('Fortryd seneste?')) return; S.log180.pop(); S.e180=null; persist(); render(); }
function lockFinal(t){ const f=finalists(t); if(!f) return false; if(t.final.a==null){ t.final.a=f[0]; t.final.b=f[1]; } return true; }
function leg(k,idx,side,d){
  const t=S[k], m=getM(t,idx);
  if(idx<0 && !lockFinal(t)) return;
  if(d>0){ if(calc(t,m).done) return; m.legs.push(side); }
  else { const i=m.legs.lastIndexOf(side); if(i<0) return; m.legs.splice(i,1); }
  m.live = !calc(t,m).done && (m.legs.length>0 || m.live);
  persist(); render();
}
function toggleLive(k,idx){ if(idx<0 && !lockFinal(S[k])) return; const m=getM(S[k],idx); m.live=!m.live; persist(); render(); }
function clearM(k,idx){ const m=getM(S[k],idx); if(m.legs.length && !confirm('Nulstil denne kamp?')) return; m.legs=[]; m.live=false; if(idx<0){ m.a=null; m.b=null; } persist(); render(); }
function resetAll(){ if(!confirm('Slet alle resultater og start forfra?')) return; S=defaults(); persist(); renderAdmin(true); }

function render(){ location.hash==='#skaerm' ? renderDisplay() : renderAdmin(); }
window.addEventListener('hashchange',()=>{ document.getElementById('app').innerHTML=''; render(); });
render();
</script>
